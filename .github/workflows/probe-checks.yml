name: Phase 0 offline probe checks
on:
  pull_request:
  push:
    branches: [research/phase-0-data-feasibility]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnostic and denial regressions (synthetic fixtures only)
        run: python -m unittest discover -s tests -v
      - name: Compile probes
        run: python -m py_compile scripts/probe.py scripts/prepare_westock.py
